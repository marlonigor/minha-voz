name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permissions
        run: chmod +x gradlew bin/* scripts/* || true

      - name: Run setup and headless tests
        run: |
          ./bin/setup
          ./bin/test

      - name: Build release artifacts
        run: ./bin/deploy

      - name: Extract release notes from CHANGELOG
        run: |
          bash scripts/extract_changelog.sh "${{ github.ref_name }}" > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Release ${{ github.ref_name }}" > RELEASE_NOTES.md
          fi

      - name: Prepare distribution and compute SHA256 checksums
        run: |
          mkdir -p release-dist
          cp app/build/outputs/apk/release/*.apk release-dist/ || true
          cp app/build/outputs/bundle/release/*.aab release-dist/ || true
          cd release-dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Release ${{ github.ref_name }}" \
            --notes-file RELEASE_NOTES.md \
            release-dist/*
