name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Test and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permissions
        run: chmod +x gradlew bin/setup bin/test bin/deploy

      - name: Run setup script
        run: ./bin/setup

      - name: Run headless test suite and lint
        run: ./bin/test
